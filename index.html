<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout de Compra</title>
</head>
<style>
    body {
        background-color: #f4f4f5;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
    }

    section {
        background-color: rgb(255, 255, 255);
        border: 1px solid rgba(173, 173, 173, 0.3);
        border-radius: 20px;
        width: 90%;
        max-width: 450px;
        min-height: 600px;
        padding: 30px;
        box-sizing: border-box;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .primeiroTexto {
        color: black;
        font-size: 28px;
        font-weight: bold;
        text-align: center;
        margin-top: 10px;
        margin-bottom: 30px;
    }

    .campo-grupo {
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
    }

    .campo-grupo label {
        font-size: 14px;
        font-weight: bold;
        color: #4b5563;
        margin-bottom: 8px;
    }

    .campo-grupo input {
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 16px;
        color: #374151;
        outline: none;
    }

    .titulo-pagamento {
        font-size: 14px;
        font-weight: bold;
        color: #4b5563;
        text-align: center;
        margin-top: 25px;
        margin-bottom: 15px;
    }

    .botoes-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 30px;
    }

    .btn-pagamento {
        padding: 12px;
        font-size: 14px;
        font-weight: bold;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: opacity 0.2s ease;
    }

    .btn-pagamento:hover {
        opacity: 0.9;
    }

    .btn-pix { background-color: #0d9488; }
    .btn-dinheiro { background-color: #16a34a; }
    .btn-cartao { background-color: #0070f3; }
    .btn-parcelado { background-color: #6b7280; }

    .box-total {
        background-color: #f8fafc;
        border-left: 4px solid #0070f3;
        border-radius: 0 8px 8px 0;
        padding: 20px;
        margin-top: auto;
    }

    .box-total p {
        margin: 0;
        font-size: 14px;
        color: #374151;
        font-weight: bold;
    }
</style>

<body>

    <section>
        <h1 class="primeiroTexto">Checkout de Compra</h1>

        <!-- Campos de Entrada -->
        <div class="campo-grupo">
            <label>Preço do Produto (R\$):</label>
            <input type="text" placeholder="Ex: 100.00" id="preco">
        </div>

        <div class="campo-grupo">
            <label>Valor do Frete (R\$):</label>
            <input type="text" placeholder="Ex: 15.00" id="frete">
        </div>

        <!-- Seção de Formas de Pagamento (Atualizado com a nova função) -->
        <div class="titulo-pagamento">Forma de Pagamento:</div>

        <div class="botoes-grid">
            <button class="btn-pagamento btn-pix" id="pagaPix" onclick="pagamento('pix')">PIX (-10%)</button>
            <button class="btn-pagamento btn-dinheiro" onclick="pagamento('dinheiro')">Dinheiro (-5%)</button>
            <button class="btn-pagamento btn-cartao" onclick="pagamento('cartao')">Cartão à vista</button>
            <button class="btn-pagamento btn-parcelado" onclick="pagamento('parcelado')">Parcelado (+5%)</button>
        </div>

        <!-- Box de Resumo Final -->
        <div class="box-total">
            <p id="forma-selecionada">Forma: -</p>
            <p class="resultado">Total: R\$ 0.00</p>
        </div>
    </section>

    <script>
        function pagamento(metodo) {
            let preco = Number(document.getElementById("preco").value);
            let frete = Number(document.getElementById("frete").value);
            let subTotal = preco + frete;
            
            let valorApagar = 0;
            let textoForma = "";

            // Verifica qual método foi clicado e faz o cálculo/texto correto
            if (metodo === 'pix') {
                valorApagar = subTotal * 0.9;
                textoForma = "Forma: PIX (-10%)";
            } 
            else if (metodo === 'dinheiro') {
                valorApagar = subTotal * 0.95;
                textoForma = "Forma: Dinheiro (-5%)";
            } 
            else if (metodo === 'cartao') {
                valorApagar = subTotal;
                textoForma = "Forma: Cartão à vista";
            } 
            else if (metodo === 'parcelado') {
                valorApagar = subTotal * 1.05;
                textoForma = "Forma: Parcelado (+5%)";
            }

            // Altera os elementos na tela
            document.getElementById('forma-selecionada').innerText = textoForma;
            document.getElementsByClassName('resultado')[0].innerText = `Total: R$ ${valorApagar.toFixed(2)}`;
        }
    </script>

</body>

</html>
